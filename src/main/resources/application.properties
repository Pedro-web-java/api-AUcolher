spring.application.name=aucolher-api

# ===================== Servidor =====================
server.port=8080

# Origens do frontend liberadas no CORS (separe por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===================== PostgreSQL =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/aucolher_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / Hibernate =====================
# O schema oficial é o sql/schema.sql (cópia de docs/script_banco_aucolher.sql no
# frontend): rode-o antes de subir a API. ddl-auto=validate só confere se o banco
# bate com as entidades — nada de schema criado/alterado por baixo dos panos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================== OAuth2 - Google =====================
# Crie as credenciais em https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:seu-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:seu-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===================== JWT =====================
# Sem segredo versionado: defina JWT_SECRET (mínimo 32 caracteres) no ambiente.
# Se ficar em branco, a API gera uma chave aleatória a cada execução — serve para
# desenvolvimento, mas derruba os tokens emitidos a cada restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== Conta admin =====================
# Não existe cadastro público de admin: ao subir, a API cria a conta ADMIN
# com estes dados se o e-mail ainda não existir (AdminAccountInitializer).
# Sem senha versionada, como no JWT: defina ADMIN_EMAIL e ADMIN_PASSWORD
# (mínimo 8 caracteres) no ambiente. Sem elas, nenhum admin é criado.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrador}

# ===================== Logging =====================
logging.level.org.springframework.security=INFO
