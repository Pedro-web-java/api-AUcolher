spring.application.name=aucolher-api

# ===================== Servidor =====================
server.port=8080

# Origens do frontend liberadas no CORS (separe por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Endereço do frontend: para onde a API volta depois do login com o Google
# (/login/google?code=... ou ?error=...)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ===================== PostgreSQL =====================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aucolher_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / Hibernate =====================
# O schema oficial é o sql/schema.sql (cópia de docs/script_banco_aucolher.sql no
# frontend): rode-o antes de subir a API. ddl-auto=validate só confere se o banco
# bate com as entidades — nada de schema criado/alterado por baixo dos panos.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================== OAuth2 - Google =====================
# Crie as credenciais em https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:seu-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:seu-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===================== JWT =====================
# Sem segredo versionado: defina JWT_SECRET (mínimo 32 caracteres) no ambiente.
# Se ficar em branco, a API gera uma chave aleatória a cada execução — serve para
# desenvolvimento, mas derruba os tokens emitidos a cada restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== Mercado Pago (PIX das doações) =====================
# PROVISÓRIO até a migração 009 (conta Mercado Pago de cada ONG, por OAuth):
# todas as ONGs usam o mesmo token de teste. Sem MP_DEV_ACCESS_TOKEN, as
# campanhas funcionam, mas doar responde 400 ("Esta ONG não está recebendo
# doações no momento."). No sandbox o pagador vai como "APRO" (aprova sozinho).
app.mercadopago.base-url=${MP_BASE_URL:https://api.mercadopago.com}
app.mercadopago.sandbox=${MP_SANDBOX:true}
app.mercadopago.dev-access-token=${MP_DEV_ACCESS_TOKEN:}
# Assinatura secreta dos webhooks (painel do Mercado Pago → Webhooks). Sem ela, todo webhook vira 401
app.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}

# ===================== Logging =====================
logging.level.org.springframework.security=INFO
